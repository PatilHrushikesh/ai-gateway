# Dedicated Rate Limit Service for AI Gateway QuotaPolicy enforcement.
#
# This service reads quota descriptors from the AI Gateway controller's xDS
# endpoint and stores counters in the existing Valkey Sentinel deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
  labels:
    app: envoy-ai-gateway-ratelimit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-ratelimit
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-ratelimit
    spec:
      # k1 currently has the fallback image cached on this node. Remove this
      # nodeSelector and use imagePullPolicy: IfNotPresent after publishing the
      # validated rate-limit image to a registry reachable by the cluster.
      nodeSelector:
        kubernetes.io/hostname: duhara-hrushikesh-20-21-worker-0-b6w8l-hmdh2-v2wql
      containers:
        - name: ratelimit
          command:
            - /bin/ratelimit
          # Temporary k1 fallback: this image is already present on the
          # selected node while Docker Hub is returning HTTP 429.
          image: docker.io/envoyproxy/ratelimit:8fe6ea42
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: grpc
            - containerPort: 8080
              name: health
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          env:
            - name: LOG_LEVEL
              value: debug
            - name: REDIS_TYPE
              value: sentinel
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: mymaster,nai-valkey-sentinel.nai-system.svc.cluster.local:26379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: USE_STATSD
              value: "false"
            - name: CONFIG_TYPE
              value: GRPC_XDS_SOTW
            - name: CONFIG_GRPC_XDS_NODE_ID
              value: envoy-ai-gateway-ratelimit
            - name: CONFIG_GRPC_XDS_SERVER_URL
              value: ai-gateway-controller.nai-system.svc.cluster.local:18002
            - name: GRPC_PORT
              value: "8081"
            - name: RESPONSE_DYNAMIC_METADATA
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
  labels:
    app: envoy-ai-gateway-ratelimit
spec:
  selector:
    app: envoy-ai-gateway-ratelimit
  ports:
    - name: grpc
      protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
